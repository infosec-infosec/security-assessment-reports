      <stop offset="0%" stop-color="#f8f8f6"/>
      <stop offset="100%" stop-color="#ededeb"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" x2="1">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="768" fill="url(#bg)"/>
  <g opacity="0.12">
    <circle cx="190" cy="170" r="120" fill="#b5b5b5"/>
    <circle cx="845" cy="200" r="110" fill="#b5b5b5"/>
    <circle cx="770" cy="620" r="140" fill="#b5b5b5"/>
  </g>

  <g transform="translate(160 120)">
