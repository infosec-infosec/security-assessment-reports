    <path d="M80 120 L110 150 L160 94" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="120" y1="8" x2="120" y2="58" stroke="#4a4a4a" stroke-width="8"/>
    <line x1="120" y1="232" x2="120" y2="182" stroke="#4a4a4a" stroke-width="8"/>
