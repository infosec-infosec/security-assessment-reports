<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">Security hero illustration</title>
  <desc id="desc">Minimal vector illustration showing a shield, network, and a lock to represent security assessment work.</desc>
  <defs>
