    <path d="M200 50 L335 110 L335 255 C335 320 275 365 200 408 C125 365 65 320 65 255 L65 110 Z" fill="#ffffff" opacity="0.96"/>
    <path d="M200 98 L255 116 L255 186 C255 228 228 255 200 272 C172 255 145 228 145 186 L145 116 Z" fill="#373737"/>
    <rect x="137" y="340" width="126" height="12" rx="6" fill="#d0d0d0"/>
    <rect x="118" y="364" width="164" height="12" rx="6" fill="#d0d0d0"/>
    <rect x="135" y="388" width="130" height="12" rx="6" fill="#d0d0d0"/>
