<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Security risk summary</title>
  <desc id="desc">Bar chart summarizing the assessed severity of key findings.</desc>
  <rect width="1000" height="620" fill="#f7f7f5"/>
  <text x="500" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1d1d1d">Risk Summary</text>
  <text x="500" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b5b5b">Observed findings by severity</text>

  <rect x="120" y="120" width="760" height="390" fill="#ffffff" stroke="#2d2d2d" stroke-width="2"/>

  <line x1="180" y1="460" x2="820" y2="460" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="180" y1="460" x2="180" y2="140" stroke="#4a4a4a" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">
    <text x="180" y="480" text-anchor="middle">PHP</text>
    <text x="295" y="480" text-anchor="middle">phpMyAdmin</text>
    <text x="410" y="480" text-anchor="middle">TLS</text>
    <text x="525" y="480" text-anchor="middle">Cookies</text>
    <text x="640" y="480" text-anchor="middle">DNS</text>
    <text x="755" y="480" text-anchor="middle">App</text>
  </g>

  <g>
    <rect x="150" y="265" width="60" height="195" fill="#6a6a6a"/>
    <rect x="265" y="275" width="60" height="185" fill="#6a6a6a"/>
    <rect x="380" y="335" width="60" height="125" fill="#8a8a8a"/>
    <rect x="495" y="395" width="60" height="65" fill="#b6b6b6"/>
    <rect x="610" y="425" width="60" height="35" fill="#d7d7d7"/>
    <rect x="725" y="450" width="60" height="10" fill="#ececec"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d1d1d">
    <text x="180" y="250" text-anchor="middle" font-weight="700">High</text>
    <text x="295" y="260" text-anchor="middle" font-weight="700">High</text>
    <text x="410" y="320" text-anchor="middle" font-weight="700">Medium</text>
    <text x="525" y="380" text-anchor="middle" font-weight="700">Low</text>
    <text x="640" y="410" text-anchor="middle" font-weight="700">Info</text>
    <text x="755" y="440" text-anchor="middle" font-weight="700">No finding</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666">
    <text x="170" y="540" text-anchor="middle">Legend</text>
    <rect x="240" y="528" width="18" height="18" fill="#6a6a6a"/>
    <text x="268" y="542">High</text>
    <rect x="330" y="528" width="18" height="18" fill="#8a8a8a"/>
    <text x="358" y="542">Medium</text>
    <rect x="440" y="528" width="18" height="18" fill="#b6b6b6"/>
    <text x="468" y="542">Low</text>
    <rect x="510" y="528" width="18" height="18" fill="#d7d7d7"/>
    <text x="538" y="542">Informational</text>
  </g>
</svg>
