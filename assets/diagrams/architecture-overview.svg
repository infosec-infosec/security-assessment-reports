<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Security assessment architecture overview</title>
  <desc id="desc">Diagram showing external internet exposure, TLS endpoint, web application, phpMyAdmin, database, and security concerns.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f7f7f5"/>
      <stop offset="100%" stop-color="#efefeb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1d1d1d">Target Architecture Overview</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b5b5b">Externally observable services and primary security concerns</text>

  <rect x="70" y="150" width="180" height="110" rx="12" fill="#ffffff" stroke="#333333" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1d1d1d">Internet</text>
  <text x="160" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">Public-facing access</text>

  <rect x="295" y="120" width="250" height="170" rx="14" fill="#ffffff" stroke="#2f2f2f" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d1d1d">HTTPS Endpoint</text>
  <text x="420" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">TLS 1.0 / 1.1 enabled</text>
  <text x="420" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">Weak cookie posture</text>
  <text x="420" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">Wildcard DNS exposure</text>

  <rect x="590" y="120" width="260" height="170" rx="14" fill="#ffffff" stroke="#2f2f2f" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d1d1d">Web Application</text>
  <text x="720" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">Search endpoint reviewed</text>
  <text x="720" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">No XSS/SQLi observed in test scope</text>
  <text x="720" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">Limited validation boundaries</text>

  <rect x="885" y="120" width="215" height="170" rx="14" fill="#ffffff" stroke="#2f2f2f" stroke-width="2" filter="url(#shadow)"/>
  <text x="992" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d1d1d">Database Layer</text>
  <text x="992" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">Not directly confirmed</text>
  <text x="992" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">No direct compromise observed</text>
  <text x="992" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">Application-code review required</text>

  <line x1="250" y1="205" x2="295" y2="205" stroke="#4a4a4a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="545" y1="205" x2="590" y2="205" stroke="#4a4a4a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="850" y1="205" x2="885" y2="205" stroke="#4a4a4a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="305" y="370" width="260" height="175" rx="14" fill="#fff8f1" stroke="#d99557" stroke-width="2" filter="url(#shadow)"/>
  <text x="435" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d1d1d">Infrastructure Risk</text>
  <text x="435" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">PHP 5.3.10</text>
  <text x="435" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">Legacy TLS enabled</text>
  <text x="435" y="501" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">Wildcard DNS</text>
  <text x="435" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">Public phpMyAdmin exposure</text>

  <rect x="620" y="370" width="260" height="175" rx="14" fill="#f5f5f5" stroke="#666666" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d1d1d">Application Risk</text>
  <text x="750" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">Search input reviewed</text>
  <text x="750" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">No XSS observed</text>
  <text x="750" y="501" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">No SQLi observed</text>
  <text x="750" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">Scope-limited conclusion</text>

  <line x1="420" y1="290" x2="420" y2="370" stroke="#666666" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="720" y1="290" x2="720" y2="370" stroke="#666666" stroke-width="2" stroke-dasharray="8 8"/>

  <rect x="930" y="390" width="170" height="120" rx="12" fill="#ffffff" stroke="#1d1d1d" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d1d1d">Priority</text>
  <text x="1015" y="468" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">Immediate remediation</text>
  <text x="1015" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a4a4a">Hardware and software hardening</text>
</svg>
